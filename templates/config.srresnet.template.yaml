seed_everything: 42

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-4

model:
  model:
    class_path: sisr.models.srresnet.SRResNet
    init_args:
      scale: 4
      in_out_channels: 3
      hidden_channel: 64
      kernel_sizes: [9, 3, 9]
      num_residual_blocks: 16
      padding: same
  training_config:
    class_path: sisr.training.SRTrainingConfig
    init_args:
      model_colorspace: RGB
      example_input_shape: [3, 24, 24]   # For TensorBoard graph
  eval_config:
    class_path: sisr.training.SREvalConfig
    init_args:
      crop_border: 4
      psnr_channels: [RGB, YCbCr]

data:
  train_dataset:
    class_path: sisr.datasets.srresnet.TrainDataset
    init_args:
      img_dir: data/DIV2K_train_HR
      scale: 4
      hr_crop_size: 96
      crops_per_image: 1
  val_dataset:
    class_path: sisr.datasets.srresnet.ValidationDataset
    init_args:
      img_dir: data/DIV2K_valid_HR
      scale: 4
  test_datasets:
    Set5:
      class_path: sisr.datasets.srresnet.ValidationDataset
      init_args:
        img_dir: data/Set5_HR
        scale: 4
    Set14:
      class_path: sisr.datasets.srresnet.ValidationDataset
      init_args:
        img_dir: data/Set14_HR
        scale: 4
  train_dataloader_kwargs:
    batch_size: 16
    num_workers: 16
    pin_memory: true
    persistent_workers: true
  val_dataloader_kwargs:
    batch_size: 1
    num_workers: 2
    persistent_workers: true
  test_dataloader_kwargs:
    batch_size: 1
    num_workers: 2
    persistent_workers: true

trainer:
  max_epochs: -1
  max_steps: 1000000
  val_check_interval: 20000
  check_val_every_n_epoch: null
  num_sanity_val_steps: -1
  log_every_n_steps: 500
  deterministic: false
  accelerator: cuda
  devices: [0]
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - class_path: sisr.training.BenchmarkImageLogger
      init_args:
        log_every_n_val_runs: 1
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: val_psnr(RGB)
        save_top_k: 3
        dirpath: experiments/SRResNet/baseline
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: val_ssim
        save_top_k: 3
        dirpath: experiments/SRResNet/baseline
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: sisr.training.GradNormLogger
      init_args:
        log_every_n_steps: 2000
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: experiments
        name: SRResNet
        version: baseline
        log_graph: true
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: experiments
        name: SRResNet
        version: baseline
