seed_everything: 42

# TF32 matmul/conv kernels on Ampere+ GPUs (confirmed here: RTX 5060 Laptop, sm_120
# Blackwell) — a standard free lever with no precision opt-in, unlike bf16-mixed below.
matmul_precision: high
# Autotunes a conv kernel per input shape on first sight and caches it — free here since
# every training step feeds the same hr_crop_size/scale LR crop shape (24x24 below).
cudnn_benchmark: true

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-4

model:
  model:
    class_path: sisr.models.srresnet.SRResNet
    init_args:
      scale: &scale 4
      in_out_channels: 3
      hidden_channel: 64
      kernel_sizes: [9, 3, 9]
      num_residual_blocks: 16
      padding: same
  processor:
    class_path: sisr.processors.RGBProcessor
  training_config:
    class_path: sisr.models.srresnet.SRResNetTrainingConfig
    init_args:
      example_input_shape: [3, 24, 24]   # For TensorBoard graph
  eval_config:
    class_path: sisr.models.srresnet.SRResNetEvalConfig

data:
  # resize_backend defaults to 'matlab' (MATLAB-compatible antialiased bicubic,
  # comparable to published paper numbers) on every dataset below; 'cv2' exists
  # solely to reproduce LMDB caches built before the matlab backend existed.
  # See README.md's benchmark protocol section.
  train_dataset:
    class_path: sisr.datasets.srresnet.TrainDataset
    init_args:
      img_dir: data/DIV2K_train_HR
      scale: *scale
      hr_crop_size: 96
      crops_per_image: 1
      use_tqdm: true
      cache_dir: .lmdb_cache/DIV2K_train_HR
  val_dataset:
    class_path: sisr.datasets.srresnet.ValidationDataset
    init_args:
      img_dir: data/DIV2K_valid_HR
      scale: *scale
  test_datasets:
    Set5:
      class_path: sisr.datasets.srresnet.ValidationDataset
      init_args:
        img_dir: data/Set5_HR
        scale: *scale
    Set14:
      class_path: sisr.datasets.srresnet.ValidationDataset
      init_args:
        img_dir: data/Set14_HR
        scale: *scale
  train_dataloader_kwargs:
    batch_size: 16
    num_workers: 16
    pin_memory: true
    persistent_workers: true
  val_dataloader_kwargs:
    batch_size: 1
    num_workers: 2
    persistent_workers: true

trainer:
  max_epochs: -1
  max_steps: 1000000
  val_check_interval: 20000
  check_val_every_n_epoch: null
  num_sanity_val_steps: -1
  log_every_n_steps: 500
  deterministic: false
  # bf16-mixed is a larger throughput lever than the two above, but this is a
  # paper-reproduction repo: the shipped default must train in full fp32 so results stay
  # comparable to the paper. Uncomment for your own runs on bf16-capable hardware (confirmed
  # here via torch.cuda.is_bf16_supported()).
  # precision: bf16-mixed
  accelerator: cuda
  devices: [0]
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - class_path: sisr.training.BenchmarkImageLogger
      init_args:
        log_every_n_val_runs: 1
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: psnr/val/RGB
        save_top_k: 3
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: ssim/val
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: sisr.training.GradNormLogger
      init_args:
        log_every_n_steps: 2000
    # Throughput/hardware diagnostics — commented out by default (extra per-step logging
    # overhead); uncomment to profile a run. DeviceStatsMonitor works as-is.
    # ThroughputMonitor additionally needs a `batch_size_fn` callable (dotted import path);
    # batches here are (lr, hr) tuples, not plain tensors, so it needs a small project-side
    # helper — none exists yet.
    # - class_path: lightning.pytorch.callbacks.DeviceStatsMonitor
    # - class_path: lightning.pytorch.callbacks.ThroughputMonitor
    #   init_args:
    #     batch_size_fn: sisr.training.callbacks.batch_size  # example path; add if needed
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        <<: &log_dest
          save_dir: experiments
          name: SRResNet
          version: baseline
        log_graph: true
        default_hp_metric: false
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        <<: *log_dest
