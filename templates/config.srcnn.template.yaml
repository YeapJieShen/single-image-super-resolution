# SRCNN -- Dong et al., pre-upsampled LR, Y-channel only.
# Settings are explained in docs/configuration.md. Config files must stay ASCII.
seed_everything: 42

# No-op on this repo's conv stacks; kept for matmul-heavy architectures.
matmul_precision: high

optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 1.0e-4         # base LR; ignored per-group when layer_lrs is set
    momentum: 0.9

model:
  class_path: sisr.training.SRLightning
  init_args:
      model:
        class_path: sisr.models.srcnn.SRCNN
        init_args:
          num_channels: 1                    # Y channel only
          num_filters: [64, 32]
          kernel_sizes: [9, 1, 5]
          padding: 0
      processor:
        class_path: sisr.processors.YChannelProcessor
      training_config:
        class_path: sisr.models.srcnn.SRCNNTrainingConfig
        init_args:
          scale: &scale 3
          example_input_shape: [1, 33, 33]
      # Defaults to ssim_impl: wang, the field standard.
      eval_config:
        class_path: sisr.models.srcnn.SRCNNEvalConfig

data:
  train_dataset:
    class_path: sisr.datasets.srcnn.TrainDataset
    init_args:
      img_dir: data/DIV2K_train_HR
      subimg_size: 33
      stride: 14
      scale: *scale
      use_tqdm: true
      cache_dir: .lmdb_cache/DIV2K_train_HR
  val_dataset:
    class_path: sisr.datasets.srcnn.ValidationDataset
    init_args:
      img_dir: data/DIV2K_valid_HR
      scale: *scale
  test_datasets:
    Set5:
      class_path: sisr.datasets.srcnn.ValidationDataset
      init_args:
        img_dir: data/Set5_HR
        scale: *scale
    Set14:
      class_path: sisr.datasets.srcnn.ValidationDataset
      init_args:
        img_dir: data/Set14_HR
        scale: *scale
    BSD100:
      class_path: sisr.datasets.srcnn.ValidationDataset
      init_args:
        img_dir: data/BSD100_HR
        scale: *scale
  train_dataloader_kwargs:
    # The authors' released Caffe train prototxt: hdf5_data_param.batch_size 128.
    batch_size: 128
    # Load-bearing on real data: num_workers=0 hits a hard serial floor.
    num_workers: 16
    pin_memory: true
    persistent_workers: true
  val_dataloader_kwargs:
    batch_size: 1
    num_workers: 2
    persistent_workers: true

trainer:
  max_epochs: -1
  # The authors' released solver: max_iter 15000000 ITERATIONS.
  # !! This DISAGREES with the paper, and the disagreement is deliberate to
  # preserve rather than resolve. 15000000 x 128 = 1.92e9 backpropagations,
  # against the paper's stated 8e8 (which would be 6250000 iterations here).
  # We follow the authors' file, because it is the value they state; the paper's
  # figure is presumably where they snapshotted from (snapshot: 500), but which
  # snapshot produced the published numbers is not recorded anywhere.
  # PRACTICAL: this is a very long run. snapshot cadence is what it is for --
  # stop early at a checkpoint rather than lowering this to a number no source
  # states.
  max_steps: 15000000
  val_check_interval: 750000   # 20 validation cycles over the run
  check_val_every_n_epoch: null
  num_sanity_val_steps: -1
  log_every_n_steps: 1000
  deterministic: false
  # Free here: every training step feeds the same fixed crop shape.
  benchmark: true
  # bf16-mixed measured as a REGRESSION at these batch sizes. See the docs.
  # precision: bf16-mixed
  accelerator: cuda
  devices: [0]
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - class_path: sisr.training.BenchmarkImageLogger
      init_args:
        every_n_val_runs: 1
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: psnr/val/RGB
        save_top_k: 3
    # A distinct prefix, because the derived name is a projection of the *model*'s
    # provenance and says nothing about which metric selected the file. Without it
    # this callback and the PSNR one above write the same name and Lightning
    # suffixes one `-v1` by save order. Startup now refuses that rather than
    # publishing two artifacts whose names cannot tell you which is which.
    - class_path: sisr.training.SRCheckpoint
      init_args:
        monitor_metric: ssim/val/RGB
        save_top_k: 3
        filename_prefix: sr-ssim
    # Distributable, optimizer-free weights alongside the resumable .ckpt files.
    - class_path: sisr.training.SRWeightsCheckpoint
      init_args:
        monitor_metric: psnr/val/RGB
        save_top_k: 3
    - class_path: sisr.training.SRWeightsCheckpoint
      init_args:
        monitor_metric: ssim/val/RGB
        save_top_k: 3
        filename_prefix: sr-weights-ssim
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: sisr.training.GradNormLogger
      init_args:
        every_n_batches: 5000
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        <<: &log_dest
          save_dir: experiments
          name: SRCNN
          version: baseline
        log_graph: true
        default_hp_metric: false
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        <<: *log_dest
