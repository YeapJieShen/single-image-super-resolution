[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "single-image-super-resolution"
version = "0.1.0"
description = "PyTorch Lightning framework for single-image super-resolution: SRCNN, SRResNet, and a generic LightningCLI training stack."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jie Shen Yeap", email = "yeapjieshen@hotmail.com" }
]
keywords = [
    "super-resolution",
    "single-image-super-resolution",
    "sisr",
    "srcnn",
    "srresnet",
    "pytorch",
    "pytorch-lightning",
    "deep-learning",
    "image-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Abstract runtime dependencies with compatible lower bounds — enough for
# `pip install .` to produce a working (CPU/default) environment. For an exact,
# CUDA-pinned environment use requirements.txt (the GPU install-of-record).
# Note: the CUDA torch/torchvision wheels (e.g. +cu130) are not on PyPI, so the
# specific build lives in requirements.txt, not here.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "torchmetrics>=1.4",
    "jsonargparse[signatures]>=4.27",  # required by lightning's LightningCLI
    "lmdb>=1.4",
    "pillow>=10",
    "numpy>=1.26",
    "tqdm>=4.66",
    "tensorboard>=2.16",  # default logger in the experiment templates
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
sisr = "sisr.cli:main"

[project.urls]
homepage = "https://github.com/YeapJieShen/single-image-super-resolution"
repository = "https://github.com/YeapJieShen/single-image-super-resolution"
issues = "https://github.com/YeapJieShen/single-image-super-resolution/issues"

[tool.hatch.build.targets.wheel]
packages = ["sisr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib avoids duplicate-basename collisions across test
# subdirs (e.g. tests/models/srcnn/test_model.py vs
# tests/models/srresnet/test_model.py) without requiring __init__.py files.
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:lightning.*",
    "ignore::DeprecationWarning:lightning_utilities.*",
    "ignore::PendingDeprecationWarning",
]