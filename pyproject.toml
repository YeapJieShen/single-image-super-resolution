[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "single-image-super-resolution"
dynamic = ["version"]
description = "PyTorch Lightning framework for single-image super-resolution: SRCNN, SRResNet, and a generic LightningCLI training stack."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jie Shen Yeap", email = "yeapjieshen@hotmail.com" }
]
keywords = [
    "super-resolution",
    "single-image-super-resolution",
    "sisr",
    "srcnn",
    "srresnet",
    "pytorch",
    "pytorch-lightning",
    "deep-learning",
    "image-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "torchmetrics>=1.4",
    "jsonargparse[signatures]>=4.27",
    "lmdb>=1.4",
    "pillow>=10",
    "numpy>=1.26",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    # AGPL-3.0; provides A.Compose, A.GaussianBlur, A.Resize, A.RandomCrop, A.ToFloat, and albumentations.pytorch.ToTensorV2.
    # Capped at <=2.1.0 to stay on albucore<0.1.0 (simsimd-backed). albucore 0.1.0 switched its native
    # backend to numkong, whose .pyd depends on libomp140.x86_64.dll (LLVM OpenMP runtime, not bundled
    # with Windows / Anaconda / VS Build Tools / VC++ Redistributable by default) and fails to import
    # on stock Python 3.13. Mapping confirmed: albumentationsx 2.1.0 pins albucore==0.0.41 (simsimd);
    # albumentationsx 2.1.1 pins albucore==0.1.2 (numkong). The cap is exact, not range, because the
    # albucore versions are mid-2.1.x and there is no stable boundary between sub-versions.
    "albumentationsx>=2.0,<=2.1.0",
    # cv2 is imported directly by sisr/datasets/* (for cv2.INTER_CUBIC). albumentationsx<2.2 declares
    # opencv only as optional extras ([headless] / [gui] / [contrib]), so a clean install resolves no
    # cv2 distribution by default and dataset module import fails. Declaring it explicitly here keeps
    # the requirement honest. Headless variant avoids X11/Qt baggage and matches CI/non-GUI use.
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Parallelizes the suite (see addopts `-n 8`); execnet is pulled in transitively.
    "pytest-xdist>=3.6",
    # tests/test_cli.py parses/emits config YAML directly; PyYAML otherwise
    # resolves only transitively (via jsonargparse/lightning), which is fragile.
    "pyyaml>=6",
]

[project.scripts]
sisr = "sisr.cli:main"

[project.urls]
homepage = "https://github.com/YeapJieShen/single-image-super-resolution"
repository = "https://github.com/YeapJieShen/single-image-super-resolution"
issues = "https://github.com/YeapJieShen/single-image-super-resolution/issues"

[tool.hatch.version]
path = "sisr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sisr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib avoids duplicate-basename collisions across test
# subdirs (e.g. tests/models/srcnn/test_model.py vs
# tests/models/srresnet/test_model.py) without requiring __init__.py files.
# -n 8 is the measured-clean xdist worker count; -n auto (=16 here) oversubscribed.
# Capped so it merely time-slices on smaller CI runners. --dist=loadscope keeps
# same-module tests on one worker so module-scoped fixtures (e.g. the shared
# SRCNN LMDB cache) build once instead of once per worker.
addopts = "-ra --strict-markers --import-mode=importlib -n 8 --dist=loadscope"
filterwarnings = [
    "error",
    # Lightning 2.6.5 constructs torch 2.12's deprecated pytree `LeafSpec` at
    # lightning/pytorch/utilities/_pytree.py:21, so any real Trainer loop emits a
    # FutureWarning: "`isinstance(treespec, LeafSpec)` is deprecated, use
    # `isinstance(treespec, TreeSpec) and treespec.is_leaf()` instead.".
    # Scoped to the lightning namespace + dated 2026-07-12; drop this once lightning
    # stops calling torch's deprecated pytree API (track the next lightning/torch bump).
    # Upstream: https://github.com/Lightning-AI/pytorch-lightning (pytree LeafSpec deprecation)
    "ignore::FutureWarning:lightning.*",
]