name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup-uv stopped publishing moving major/minor tags at v8.0.0 as supply-chain
      # hardening, so this pins an exact patch unlike the @v4/@v5 actions above.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # See the lint job for why this pins an exact patch version.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Run tests with coverage
        run: pytest -n 8 --cov=sisr --cov-report=xml --cov-report=term --cov-fail-under=90
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: Upload coverage artifact (fallback)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Stable required-check context: green only if every matrix leg passed
  # (legs report as "test-matrix (os, ver)", which are not fixed contexts).
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to pass
        run: '[ "${{ needs.test-matrix.result }}" = "success" ]'
