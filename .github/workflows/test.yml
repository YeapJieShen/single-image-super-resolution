name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Floor only: actions: write is granted per job, to the ones that save a cache.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Allowlist, not denylist: anything unlisted is treated as code. See docs/configuration.md.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv publishes no moving major tag since v8.0.0, so this pins an exact patch.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  # windows-latest is required: typeshed only exposes ctypes.WinDLL there.
  typecheck:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # See the lint job for why this pins an exact patch version.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: typecheck
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Mypy
        run: mypy sisr

  test-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # See the lint job for why this pins an exact patch version.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      # -n 2 is measured, not shy: more workers cost more in cold imports than they win.
      - name: Run tests with coverage
        run: pytest -n 2 --dist=loadscope --cov=sisr --cov-report=xml --cov-report=term --cov-fail-under=90
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: Upload coverage artifact (fallback)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Numeric parity for the opt-in ONNX export: torch eager vs onnxruntime CPU.
  onnx-export:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: onnx-export
      - name: Install
        run: uv pip install --system -e ".[dev,export]"
      - name: ONNX export parity tests
        run: pytest tests/test_export.py tests/test_cli.py -k export -v

  # Stable required-check context: matrix legs are not fixed contexts themselves.
  test:
    needs: [test-matrix, onnx-export]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to pass or be skipped (doc-only PR)
        run: |
          [ "${{ needs.test-matrix.result }}" = "success" ] || [ "${{ needs.test-matrix.result }}" = "skipped" ]
          [ "${{ needs.onnx-export.result }}" = "success" ] || [ "${{ needs.onnx-export.result }}" = "skipped" ]
