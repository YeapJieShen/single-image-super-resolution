name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Floor only: actions: write is granted per job, to the ones that save a cache.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Allowlist, not denylist: anything unlisted is treated as code. See docs/configuration.md.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  build-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Wheel install
        run: pip install .
      - name: Smoke import
        run: python -c "import sisr; from sisr.cli import main; print('sisr', sisr.__version__, '- main:', main)"
      # Lives here, not in pytest: this job already has the wheel installed.
      - name: CLI entry point lists subcommands
        run: |
          python -c "import subprocess; out = subprocess.run(['sisr', '--help'], capture_output=True, text=True, check=True).stdout; missing = [s for s in ('fit', 'validate', 'test', 'predict') if s not in out]; assert not missing, f'sisr --help missing subcommands: {missing}'"

  # The only leg exercising `pip install -e`, which CONTRIBUTING.md still gives.
  editable-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # setup-uv enable-cache / setup-python cache: pip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Editable install
        run: pip install -e ".[dev]"
      - name: Smoke import
        run: python -c "import sisr; from sisr.cli import main; print('sisr', sisr.__version__, '- main:', main)"

  # Stable required-check context: matrix legs are not fixed contexts themselves.
  build:
    needs: [build-matrix, editable-install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to pass or be skipped (doc-only PR)
        run: |
          [ "${{ needs.build-matrix.result }}" = "success" ] || [ "${{ needs.build-matrix.result }}" = "skipped" ]
          [ "${{ needs.editable-install.result }}" = "success" ] || [ "${{ needs.editable-install.result }}" = "skipped" ]
