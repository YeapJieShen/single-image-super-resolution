name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Wheel install
        run: pip install .
      - name: Smoke import
        run: python -c "import sisr; from sisr.cli import main; print('sisr', sisr.__version__, '- main:', main)"

  # Stable required-check context: green only if every matrix leg passed
  # (see the equivalent gate in test.yml).
  build:
    needs: build-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix legs to pass
        run: '[ "${{ needs.build-matrix.result }}" = "success" ]'
